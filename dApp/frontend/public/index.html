<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>dApp Turing — Burn Book</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Special+Elite&family=Caveat:wght@600;700&family=Rye&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ff4fa3;
            --pink-deep: #d6106f;
            --pink-pale: #ffd3e8;
            --paper: #fffaf1;
            --ink: #1b1b1f;
            --red: #d3122f;
            --green: #1f8a4c;
            --tape: rgba(255, 226, 120, .78);
            --line: #b9d3ee;
            --f-marker: "Permanent Marker", "Comic Sans MS", cursive;
            --f-type: "Special Elite", "Courier New", monospace;
            --f-hand: "Caveat", "Segoe Print", cursive;
        }

        * { box-sizing: border-box; }

        html {
            background-color: #ff4fa3 !important;
            min-height: 100%;
        }
        body {
            font-family: var(--f-type);
            color: var(--ink);
            margin: 0 !important;
            padding: 0 !important;
            min-height: 100vh;
            line-height: 1.5;
            background: transparent !important;
        }
        /* camada rosa fixa atrás de tudo, não depende do body */
        body::before {
            content: "";
            position: fixed; inset: 0; z-index: -1;
            background-color: #ff4fa3;
            background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.28) 1.5px, transparent 1.6px);
            background-size: 22px 22px;
        }
        .page {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            padding: 28px 18px 60px;
        }

        /* ---------- Capa ---------- */
        .cover { text-align: center; margin: 4px 0 30px; position: relative; }
        .cover .kicker {
            font-family: var(--f-hand); font-size: 1.5rem; font-weight: 700;
            color: #fff; transform: rotate(-3deg); display: inline-block; margin-bottom: 4px;
            text-shadow: 2px 2px 0 var(--pink-deep);
        }
        h2.title { margin: 0; line-height: 1; }
        .cut {
            display: inline-block; font-family: var(--f-marker); font-size: 2.6rem;
            padding: 2px 10px 4px; margin: 3px 2px; box-shadow: 2px 3px 0 rgba(0,0,0,.25);
        }
        .cut:nth-child(1) { background: #fff; color: var(--ink); transform: rotate(-4deg); }
        .cut:nth-child(2) { background: var(--ink); color: #fff; transform: rotate(3deg); font-family: var(--f-type); }
        .cut:nth-child(3) { background: var(--red); color: #fff; transform: rotate(-2deg); }
        .cut:nth-child(4) { background: var(--pink-pale); color: var(--pink-deep); transform: rotate(4deg); font-family: "Rye", serif; }
        .cover .sub {
            font-family: var(--f-hand); font-size: 1.35rem; color: #fff; margin: 12px 0 0;
            text-shadow: 1px 1px 0 var(--pink-deep);
        }

        /* ---------- Páginas (boxes) ---------- */
        .box {
            position: relative;
            background-color: var(--paper);
            background-image:
                linear-gradient(90deg, transparent 38px, rgba(211,18,47,.45) 38px, rgba(211,18,47,.45) 40px, transparent 40px),
                repeating-linear-gradient(transparent 0 27px, var(--line) 27px 28px);
            padding: 20px 18px 18px 54px;
            margin-bottom: 30px;
            border: 0;
            border-radius: 2px;
            box-shadow: 4px 6px 0 rgba(0,0,0,.28);
        }
        .box::before, .box::after {
            content: ""; position: absolute; top: -12px; width: 86px; height: 24px; background: var(--tape);
            box-shadow: 0 1px 2px rgba(0,0,0,.15);
        }
        .box::before { left: 18px; transform: rotate(-5deg); }
        .box::after  { right: 18px; transform: rotate(4deg); }

        .box:nth-of-type(odd)  { transform: rotate(-.6deg); }
        .box:nth-of-type(even) { transform: rotate(.5deg); }

        .admin {
            background-color: #fff0f3;
            background-image:
                linear-gradient(90deg, transparent 38px, rgba(211,18,47,.55) 38px, rgba(211,18,47,.55) 40px, transparent 40px),
                repeating-linear-gradient(transparent 0 27px, #f3b6c4 27px 28px);
            outline: 3px dashed var(--red);
            outline-offset: -9px;
        }
        .hidden { display: none; }

        h3 {
            font-family: var(--f-marker); font-weight: 400; font-size: 1.6rem; margin: 0 0 6px;
            color: var(--pink-deep); transform: rotate(-1.5deg); display: inline-block;
            text-shadow: 1px 1px 0 rgba(0,0,0,.12);
        }
        .admin h3 { color: var(--red); }

        p { margin: 8px 0; }
        strong { font-weight: 700; }
        code { background: var(--pink-pale); padding: 0 4px; }

        /* ---------- Formulário ---------- */
        label {
            display: block; margin-top: 14px; font-family: var(--f-hand); font-weight: 700;
            font-size: 1.3rem; line-height: 1.1; color: var(--ink);
        }
        select, input, button {
            width: 100%; padding: 10px 12px; margin-top: 5px; font-family: var(--f-type); font-size: 1rem;
        }
        select, input {
            background: #fff; color: var(--ink);
            border: 2px solid var(--ink); border-radius: 0; box-shadow: 3px 3px 0 var(--pink);
        }
        select:focus, input:focus, button:focus-visible {
            outline: 3px solid var(--ink); outline-offset: 2px;
        }
        option:disabled { color: #999; }

        button {
            background: var(--pink-deep); color: #fff; border: 2px solid var(--ink); border-radius: 0;
            cursor: pointer; font-family: var(--f-marker); font-size: 1.15rem; letter-spacing: .5px;
            box-shadow: 4px 4px 0 var(--ink); transition: transform .08s, box-shadow .08s;
        }
        button:hover:not(:disabled) { background: #b50a5c; }
        button:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
        button:disabled {
            background: #cfcfcf; color: #777; border-color: #777; box-shadow: 4px 4px 0 #999; cursor: not-allowed;
        }
        .btn-red { background: var(--red); }
        .btn-red:hover:not(:disabled) { background: #9f0d23; }
        .btn-green { background: var(--green); }
        .btn-green:hover:not(:disabled) { background: #166a39; }

        #btnConnect { background: var(--ink); color: #fff; box-shadow: 4px 4px 0 var(--pink); margin-bottom: 8px; }
        #btnConnect:hover:not(:disabled) { background: #333; }

        /* ---------- Status ---------- */
        #msg {
            min-height: 1.6em; font-size: .95rem; margin-top: 10px; padding: 2px 6px;
            font-family: var(--f-hand); font-weight: 700; font-size: 1.25rem;
        }
        .ok   { color: var(--green); }
        .err  { color: var(--red); }
        .info { color: #555; }
        .note { font-size: .82rem; color: #555; margin-top: 8px; word-break: break-all; }
        #voteNote { font-family: var(--f-hand); font-size: 1.15rem; font-weight: 700; color: var(--red); word-break: normal; }

        .badge {
            display: inline-block; padding: 1px 10px; font-family: var(--f-marker); font-size: .95rem;
            color: #fff; border: 2px solid var(--ink); transform: rotate(-2deg); box-shadow: 2px 2px 0 var(--ink);
        }
        .b-admin { background: var(--red); }
        .b-user  { background: var(--green); }
        .b-none  { background: #777; }

        /* ---------- Ranking ---------- */
        table { width: 100%; border-collapse: separate; border-spacing: 0 6px; margin-top: 8px; }
        th {
            font-family: var(--f-marker); font-weight: 400; font-size: .95rem; text-align: left;
            padding: 4px 8px; color: var(--pink-deep); border-bottom: 3px solid var(--ink);
        }
        td { padding: 8px; background: rgba(255,255,255,.75); }
        tbody tr td:first-child {
            font-family: var(--f-marker); font-size: 1.5rem; color: var(--pink-deep); width: 48px; text-align: center;
        }
        tbody tr td:nth-child(2) { font-family: var(--f-hand); font-size: 1.5rem; font-weight: 700; line-height: 1; }
        tbody tr td:last-child { text-align: right; white-space: nowrap; }
        tbody tr:nth-child(1) td { background: var(--pink-pale); }
        tbody tr:nth-child(1) td:nth-child(2)::after {
            content: " 👑"; font-size: 1.1rem;
        }
        tbody tr:nth-child(1) td:first-child { color: var(--red); font-size: 1.9rem; }

        @media (max-width: 420px) {
            .cut { font-size: 2.1rem; }
            .box { padding-left: 50px; padding-right: 14px; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>
<main class="page">

    <header class="cover">
        <div class="kicker">às quartas-feiras usamos rosa</div>
        <h2 class="title">
            <span class="cut">dApp</span><span class="cut">Turing</span><span class="cut">Burn</span><span class="cut">Book</span>
        </h2>
        <p class="sub">quem merece mais Turings? você decide.</p>
    </header>

    <!-- Conexão / status -->
    <div class="box">
        <button id="btnConnect" onclick="connectWallet()">Conectar Carteira</button>
        <p><strong>Usuário:</strong> <span id="userDisplay">-</span>
           | <strong>Perfil:</strong> <span id="roleDisplay"><span class="badge b-none">-</span></span></p>
        <p><strong>Votação:</strong> <span id="statusDisplay">-</span>
           | <strong>Seu saldo:</strong> <span id="balanceDisplay">0</span> TUR</p>
        <div id="msg" class="info"></div>
        <div id="debug" class="note"></div>
    </div>

    <!-- Votar (usuários registrados e superusuários) -->
    <div class="box" id="voteBox">
        <h3>Votar</h3>
        <label for="voteCandidate">Aluno:</label>
        <select id="voteCandidate"></select>

        <label for="voteAmount">Quantidade de Turings:</label>
        <select id="voteAmount">
            <option value="1">1</option>
            <option value="2">2</option>
        </select>

        <button id="btnVote" onclick="handleVote()" disabled>Enviar Voto</button>
        <div id="voteNote" class="note"></div>
    </div>

    <!-- Painel do Superusuário: issueToken, votingOn, votingOff -->
    <div id="adminPanel" class="box admin hidden">
        <h3>⚡ Painel do Superusuário</h3>

        <label for="issueTarget">Emitir para aluno:</label>
        <select id="issueTarget"></select>

        <label for="issueAmount">Quantidade de Turings:</label>
        <input type="number" id="issueAmount" min="1" step="1" value="5">

        <button onclick="handleIssue()" style="margin-bottom: 10px;">Emitir Tokens</button>

        <div style="display: flex; gap: 10px;">
            <button onclick="handleSetVoting(true)" class="btn-green">Ativar Votação</button>
            <button onclick="handleSetVoting(false)" class="btn-red">Pausar Votação</button>
        </div>
    </div>

    <!-- Ranking -->
    <div class="box">
        <h3>Ranking</h3>
        <table>
            <thead>
                <tr><th>#</th><th>Codinome</th><th>Saldo (TUR)</th></tr>
            </thead>
            <tbody id="rankingTable">
                <tr><td colspan="3">Conecte a carteira...</td></tr>
            </tbody>
        </table>
        <div class="note">Atualizado automaticamente pelos eventos <code>Transfer</code> do contrato.</div>
    </div>

</main>

<script>
    const CONTRACT_ADDRESS = "0x5FbDB2315678afecb367f032d93F642f64180aa3";

    const HARDHAT_CHAIN_ID = "0x7a69"; // 31337
    const HARDHAT_NETWORK = {
        chainId: HARDHAT_CHAIN_ID,
        chainName: "Hardhat Local",
        rpcUrls: ["http://127.0.0.1:8545"],
        nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 }
    };

    const CONTRACT_ABI = [
        "function voting() view returns (bool)",
        "function owner() view returns (address)",
        "function balanceOf(address) view returns (uint256)",
        "function users(string) view returns (address)",
        "function hasVote(string, string) view returns (bool)",
        "function vote(string codinomeCandidato, uint256 qtde_de_Turings)",
        "function issueToken(string codinome, uint256 qtde_de_Turings)",
        "function votingOn()",
        "function votingOff()",
        "event Transfer(address indexed _from, address indexed _to, uint256 _value)"
    ];

    // Codinomes pré-cadastrados no construtor do contrato.
    // Os ENDEREÇOS são lidos direto do contrato (mapping users), não ficam fixos aqui.
    const TEACHER = "roberta";
    const CODINOMES = ["roberta", "nome1", "nome2", "nome3", "nome4", "nome5"];

    let provider, contract, currentAccount = "";
    let USERS = [];          // { codinome, address, isTeacher }
    let listenersAttached = false;
    let refreshing = false, refreshAgain = false;

    const $ = id => document.getElementById(id);
    const same = (a, b) => a && b && a.toLowerCase() === b.toLowerCase();
    const students = () => USERS.filter(u => !u.isTeacher);

    function setMsg(text, cls = "info") { $("msg").textContent = text; $("msg").className = cls; }

    function errText(err) {
        if (err && (err.code === 4001 || err.code === "ACTION_REJECTED")) return "Transação cancelada na carteira.";
        const raw = (err && ((err.error && err.error.data && err.error.data.message) || (err.data && err.data.message) ||
                    (err.error && err.error.message) || err.reason || err.message)) || String(err);
        const m = raw.match(/reverted with reason string '([^']+)'/) || raw.match(/execution reverted: ([^"'}]+)/);
        return m ? m[1].trim() : raw;
    }

    async function ensureHardhatNetwork() {
        const chainId = await window.ethereum.request({ method: "eth_chainId" });
        if (chainId === HARDHAT_CHAIN_ID) return;
        try {
            await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: HARDHAT_CHAIN_ID }] });
        } catch (e) {
            if (e.code === 4902) {
                await window.ethereum.request({ method: "wallet_addEthereumChain", params: [HARDHAT_NETWORK] });
            } else { throw e; }
        }
    }

    async function connectWallet() {
        if (!window.ethereum) return alert("Instale o MetaMask! (e abra esta página via http://localhost, não file://)");
        try {
            setMsg("Conectando...");
            await ensureHardhatNetwork();

            provider = new ethers.providers.Web3Provider(window.ethereum, "any");
            const accounts = await provider.send("eth_requestAccounts", []);
            currentAccount = accounts[0];
            contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, provider.getSigner());

            if ((await provider.getCode(CONTRACT_ADDRESS)) === "0x") {
                setMsg("Nenhum contrato nesse endereço. Faça o deploy novamente e atualize CONTRACT_ADDRESS.", "err");
                return;
            }

            // Endereços dos usuários vêm do contrato
            const addrs = await Promise.all(CODINOMES.map(c => contract.users(c)));
            USERS = CODINOMES.map((c, i) => ({ codinome: c, address: addrs[i], isTeacher: c === TEACHER }));

            // Select de emissão (somente alunos, sem a professora)
            $("issueTarget").innerHTML = students().map(s => `<option value="${s.codinome}">${s.codinome}</option>`).join("");

            if (!listenersAttached) {
                listenersAttached = true;
                window.ethereum.on("accountsChanged", () => window.location.reload());
                window.ethereum.on("chainChanged", () => window.location.reload());
            }
            // Ranking por eventos: qualquer Transfer (vote, issueToken, bônus) atualiza a tela
            contract.removeAllListeners("Transfer");
            contract.on("Transfer", () => refresh());

            $("btnConnect").innerText = "Carteira conectada";
            await refresh();
            setMsg("Conectado.", "ok");
        } catch (err) {
            setMsg("Erro ao conectar: " + errText(err), "err");
        }
    }

    // Evita atualizações concorrentes (vários eventos seguidos)
    async function refresh() {
        if (refreshing) { refreshAgain = true; return; }
        refreshing = true;
        try {
            do { refreshAgain = false; await updateUI(); } while (refreshAgain);
        } catch (e) { console.error(e); }
        refreshing = false;
    }

    async function updateUI() {
        const me = USERS.find(u => same(u.address, currentAccount));
        const owner = await contract.owner();
        const isOwner = same(owner, currentAccount);
        const isAdmin = !!(me && me.isTeacher) || isOwner;

        const teacher = USERS.find(u => u.isTeacher);
        $("debug").innerHTML = `Sua conta: ${currentAccount}<br>Owner do contrato: ${owner}<br>Professora (roberta): ${teacher ? teacher.address : "-"}`;

        $("userDisplay").innerText = me ? me.codinome : (isOwner ? "owner" : "Desconhecido");
        $("roleDisplay").innerHTML = isAdmin ? '<span class="badge b-admin">Superusuário</span>'
                                  : me ? '<span class="badge b-user">Usuário comum</span>'
                                       : '<span class="badge b-none">Não registrado</span>';

        // Interfaces diferentes: painel admin só para superusuários
        $("adminPanel").classList.toggle("hidden", !isAdmin);

        const [balance, active] = await Promise.all([contract.balanceOf(currentAccount), contract.voting()]);
        $("balanceDisplay").innerText = balance.toString();
        $("statusDisplay").innerText = active ? "Ativa 🟢" : "Pausada 🔴";

        // Select de votação: marca quem já foi votado e o próprio usuário
        const prev = $("voteCandidate").value;
        const voted = me ? await Promise.all(students().map(s => contract.hasVote(me.codinome, s.codinome))) : [];
        $("voteCandidate").innerHTML = students().map((s, i) => {
            const isSelf = me && me.codinome === s.codinome;
            const already = voted[i];
            const dis = isSelf || already ? "disabled" : "";
            const tag = isSelf ? " (você)" : already ? " (já votado)" : "";
            return `<option value="${s.codinome}" ${dis}>${s.codinome}${tag}</option>`;
        }).join("");
        if (prev && !$("voteCandidate").querySelector(`option[value="${prev}"]`)?.disabled) $("voteCandidate").value = prev;
        else { const firstOk = [...$("voteCandidate").options].find(o => !o.disabled); if (firstOk) $("voteCandidate").value = firstOk.value; }

        const hasOption = [...$("voteCandidate").options].some(o => !o.disabled);
        $("btnVote").disabled = !(me && active && hasOption);
        $("voteNote").textContent = !me ? "Esta conta não é um usuário pré-autorizado a votar (ex.: o owner do deploy)."
                                   : !active ? "A votação está pausada."
                                   : !hasOption ? "Você já votou em todos os alunos." : "";

        await updateRanking();
    }

    async function updateRanking() {
        const list = students();
        const bals = await Promise.all(list.map(u => contract.balanceOf(u.address)));
        const rows = list.map((u, i) => ({ codinome: u.codinome, balance: bals[i] }));
        rows.sort((a, b) => b.balance.gt(a.balance) ? 1 : b.balance.lt(a.balance) ? -1 : a.codinome.localeCompare(b.codinome));
        $("rankingTable").innerHTML = rows.map((r, i) =>
            `<tr><td>${i + 1}</td><td>${r.codinome}</td><td><strong>${r.balance.toString()} TUR</strong></td></tr>`).join("");
    }

    async function sendTx(label, fn) {
        try {
            setMsg(label + " — confirme na carteira...");
            const tx = await fn();
            setMsg("Aguardando confirmação...");
            await tx.wait();
            setMsg(label + ": sucesso!", "ok");
            await refresh();
        } catch (err) {
            setMsg("Erro: " + errText(err), "err");
        }
    }

    async function handleVote() {
        const cand = $("voteCandidate").value;
        const amount = parseInt($("voteAmount").value, 10);
        if (!cand) return setMsg("Selecione um aluno.", "err");
        if (amount !== 1 && amount !== 2) return setMsg("Escolha 1 ou 2 Turings.", "err");
        await sendTx("Voto", () => contract.vote(cand, amount));
    }

    async function handleIssue() {
        const target = $("issueTarget").value;
        const amount = parseInt($("issueAmount").value, 10);
        if (!target) return setMsg("Selecione um aluno.", "err");
        if (!(amount > 0)) return setMsg("Quantidade deve ser maior que zero.", "err");
        await sendTx("Emissão", () => contract.issueToken(target, amount));
    }

    async function handleSetVoting(enable) {
        await sendTx(enable ? "Ativar votação" : "Pausar votação",
            () => enable ? contract.votingOn() : contract.votingOff());
    }
</script>
</body>
</html>
